[package]
name = "ibox"
version = "0.1.53"
description = "iBox — bibliothèque de jeux et frontend d'émulation"
edition = "2021"

[lib]
name = "ibox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3.27.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
walkdir = "2.5.0"
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
tauri-plugin-dialog = "2"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
crc32fast = "1.5.5"
imagesize = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "gzip"] }
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"
tokio = { version = "1", features = ["rt", "time"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
png = "0.18"
gif = "0.13"
jpeg-encoder = "0.6"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
minisign-verify = "0.2"
base64 = "0.22"
