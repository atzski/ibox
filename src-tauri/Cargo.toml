[package]
name = "ibox"
version = "1.0.3"
description = "iBox — bibliothèque de jeux et frontend d'émulation"
edition = "2021"

[lib]
name = "ibox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3.27.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
walkdir = "2.5.0"
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
tauri-plugin-dialog = "2"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
crc32fast = "1.5.5"
imagesize = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "gzip"] }
keyring-core = "1.0.1"
tokio = { version = "1", features = ["rt", "time"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
png = "0.18"
gif = "0.13"
jpeg-encoder = "0.6"
# Remote Play : identité d'appareil (BSD-3-Clause), empreintes et code de sécurité
ed25519-dalek = "3"
sha2 = "0.11"
getrandom = "0.3"
base64 = "0.22"
# son Remote Play : encodeur Opus en Rust pur (BSD-3-Clause, aucune dépendance, pas de C à compiler)
opus-rs = "0.1.42"
# iBox Platforms : archives .7z des émulateurs officiels (Rust pur, Apache-2.0)
sevenz-rust2 = { version = "0.25", default-features = false, features = ["util"] }
# archives .tar.xz (Xenia Canary sous Linux) : mêmes bibliothèques que l'extraction 7z
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Graphics_Capture", "Foundation", "Media_Control", "Security_Authorization_AppCapabilityAccess", "Storage_Streams", "Graphics", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Cryptography", "Win32_UI_HiDpi", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp"] }
# manettes virtuelles Remote Play : client ViGEmBus en Rust pur (MIT), utilisé seulement si le pilote est déjà installé
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
# transport P2P Remote Play (MIT/Apache-2.0, sans E/S) ; cryptographie Windows CNG : ni OpenSSL ni AWS-LC à livrer
str0m = { version = "0.25", default-features = false, features = ["wincrypto"] }
# `#[implement]` (rappel COM de l'activation du son « sans Discord »), même version que `windows`
windows-core = "0.62"

[target.'cfg(not(windows))'.dependencies]
# invité Remote Play du Steam Deck : même transport, cryptographie en Rust pur (rien à livrer
# dans l'AppImage, pas de dépendance à l'OpenSSL du système). docs/STEAMDECK.md §6.3
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# « unwind » : une panique dans un fil de fond (métadonnées, Remote Play…) arrête ce fil,
# pas toute l'application ; elle est écrite dans logs/crash.log (crash.rs)
panic = "unwind"
strip = true

# Code chaud (son, transport et chiffrement Remote Play, archives, empreintes, images) :
# optimisé pour la vitesse, le reste de l'application reste compact
[profile.release.package.opus-rs]
opt-level = 3
[profile.release.package.str0m]
opt-level = 3
[profile.release.package.sevenz-rust2]
opt-level = 3
[profile.release.package.zip]
opt-level = 3
[profile.release.package.xxhash-rust]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.jpeg-encoder]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3

[dev-dependencies]
minisign-verify = "0.2"
base64 = "0.22"
