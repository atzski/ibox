<html lang="fr">
<head>

<body class="lost">
<main lang="fr">
  <img src="/ibox/logo.svg" alt="" width="120" height="120">
  <h1>Ce boîtier n’est pas sur l’étagère.</h1>

</main><main lang="en" hidden>
  <img src="/ibox/logo.svg" alt="" width="120" height="120">
  <h1>This case isn’t on the shelf.</h1>
  <p>The page you asked for doesn’t exist, or no longer does.</p>
  <p><a class="btn coral" href="/ibox/en.html">Back to the home page</a></p>
</main>
<script>
  // anglais pour tout navigateur qui n’est pas réglé en français
  if (!/^fr(-|$)/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "fr")) {
    document.documentElement.lang = "en";
    document.title = "Page not found — iBox";
    document.querySelector('main[lang="fr"]').hidden = true;
    document.querySelector('main[lang="en"]').hidden = false;
  }
</script>
