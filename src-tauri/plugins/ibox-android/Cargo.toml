[package]
name = "tauri-plugin-ibox-android"
version = "0.1.0"
description = "Socle Android d'iBox : intents, stockage, plein écran immersif, relais de la manette"
edition = "2021"
publish = false
links = "tauri-plugin-ibox-android"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
